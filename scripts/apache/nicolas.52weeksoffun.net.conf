<VirtualHost *:80>
    ServerName nicolas.52weeksoffun.net

    DocumentRoot /var/www/fiftytwoweeks/nico

    <Directory /var/www/fiftytwoweeks/nico>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # SPA routing: if request is not a file, serve index.html
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteRule ^ /index.html [L]
        </IfModule>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/nicolas.52weeksoffun.net_error.log
    CustomLog ${APACHE_LOG_DIR}/nicolas.52weeksoffun.net_access.log combined
</VirtualHost>
